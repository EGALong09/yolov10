# 项目根目录
project_root: /liubh_ms/longjie/yolov10-semi_eam

# 数据集配置
datasets_base_dir: /liubh_ms/longjie/datasets/tt100k_2021

initial_dataset_yaml: tt100k.yaml  # 初始有标签数据集配置文件

labeled_data_root_dir: /liubh_ms/longjie/datasets/tt100k_2021              # 原始有标签数据根目录
unlabeled_images_dir: /liubh_ms/longjie/datasets/tt100k_2021/unlabeled      # 无标签图片目录
pseudo_labels_output_root: /liubh_ms/longjie/datasets/tt100k_2021/generated_data/pseudo_labels  # 生成的伪标签的根目录 (脚本会在其下创建 iter_N/labels 子目录)
consolidated_data_output_root: /liubh_ms/longjie/datasets/tt100k_2021/generated_data/consolidated_data # 生成的合并数据集的根目录 (脚本会在其下创建 iter_N 子目录)
generated_dataset_yamls_output_dir: /liubh_ms/longjie/datasets/tt100k_2021/generated_data/dataset_configs # 生成的迭代数据集YAML文件的存放目录

# 7. 固定验证集图片的路径 (用于评估所有模型，确保一致性)
# 这个路径应该直接指向验证集图片文件夹。
# 新生成的 dataset_iter_N.yaml 中的 'val' 字段会引用这个路径。
# 如果你的 initial_dataset_yaml 已经正确定义了验证集，并且可以被YOLO直接使用，
# 那么在 ModelEvaluator 中可以直接使用 initial_dataset_yaml 进行评估。
# 此处我们显式定义，以便 DataConsolidator 在生成新的yaml时能正确指向。
# (注意：这个路径的用法需要在 DataConsolidator 中正确处理，使其在新YAML中相对于新YAML的'path'字段正确)
# 为了简化 DataConsolidator 的逻辑，我们假设这个路径是验证集图片文件夹的绝对路径或相对于 project_root 的路径，
# DataConsolidator 在生成新的 dataset_iter_N.yaml 时，会将其转换为相对于新YAML的 `path` 字段的相对路径。
# 或者，更简单的是，让 ModelEvaluator 始终使用 initial_dataset_yaml 进行评估，这样就不需要这个配置。
# 但如果 DataConsolidator 需要它来构建新的yaml，就需要它。
# 假设 ModelEvaluator 总是用 initial_dataset_yaml评估，则此项不是必须给DataConsolidator。
# 但如果新的dataset_iter_N.yaml也需要一个val字段，它必须指向固定的验证集。
# 我们让 DataConsolidator 使用这个路径来构建新yaml的val字段。

#fixed_validation_images_path: D:/aWorkHome/project/python/datasets/coco128/images/val # 指向验证集图片
#fixed_validation_labels_path: D:/aWorkHome/project/python/datasets/coco128/labels/val # 指向验证集标签 (如果YOLO需要)
#
fixed_validation_images_path: /liubh_ms/longjie/datasets/tt100k_2021/images/val # 指向验证集图片
fixed_validation_labels_path: /liubh_ms/longjie/datasets/tt100k_2021/labels/val # 指向验证集标签 (如果YOLO需要)

# 注意：Ultralytics的dataset.yaml通常只需要images路径，它会自动查找同级目录下的labels。
# 但为了清晰，我们可以在DataConsolidator中考虑它。

# 模型配置
pretrained_model: yolov10m.pt  # 预训练模型，可选: yolov10n/s/m/l/x.pt

# 迭代训练配置
use_semi_supervised_learning: true #半监督控制
skip_baseline_training: false      # 设置为 true 来跳过基准模型训练
baseline_model_path: D:/aWorkHome/project/python/yolov10-semi_eam/runs/train_baseline/exp/weights/best.pt  # [新增] 如果跳过训练，请提供已训练好的基准模型路径
skip_baseline_eval: false         # 是否也跳过对这个提供的基准模型的初始评估
use_strong_augment_for_retrain: true # 应用数据强增强

num_iterations: 10              # 总迭代轮数
baseline_epochs: 200            # 基准模型训练轮数
retrain_epochs: 30            # 每轮迭代再训练轮数
ema_decay: 0.9996            # EMA平滑系数，推荐值非常接近1
batch_size: 16               # 批处理大小
image_size: 640                # 训练图像尺寸

#num_iterations: 10              # 总迭代轮数
#baseline_epochs: 10            # 基准模型训练轮数
#retrain_epochs: 10            # 每轮迭代再训练轮数
#ema_decay: 0.9996            # EMA平滑系数，推荐值非常接近1
#batch_size: 4               # 批处理大小
#image_size: 640                # 训练图像尺寸

# 伪标签生成配置
pseudo_label_conf_threshold: 0.3  # 伪标签置信度阈值

# [新增] FlexMatch相关配置
flexmatch_config:
  initial_threshold: 0.85        # 初始化的类别阈值
  warmup_epochs: 5               # 动态阈值更新前的热身轮数
  beta: 0.95                     # 用于计算百分位的超参数 (p_cutoff)
  threshold_update_sample_size: 2000 # 每轮更新阈值时采样的无标签图片数量
  small_target_area_thresh: 1024 # 小目标的面积阈值


# 学习率配置
retrain_learning_rate: 0.001   # 微调时的学习率

# 早停和错误处理配置
min_improvement_threshold: 0.001  # 最小性能提升阈值
early_stopping: true              # 是否启用早停
continue_on_error: false           # 出错时是否继续

# YOLO训练详细配置
yolo_config:
  device: 0                    # GPU设备号，使用CPU则设为'cpu'
  workers: 8                   # 数据加载进程数
  amp: true                    # 是否使用自动混合精度
  patience: 50                 # 早停耐心值
  seed: 0                      # 随机种子
  optimizer: SGD               # 优化器类型
  momentum: 0.937              # SGD动量
  weight_decay: 0.0005         # 权重衰减
  warmup_epochs: 3.0           # 预热轮数
  close_mosaic: 10             # 最后几轮关闭mosaic增强

  nwdloss: true                # 设置为 true 来启用NWD Loss
  iou_ratio: 0.5               # IoU损失和NWD损失的比例

  # 数据增强配置
  augment: true
  augment_params:
    hsv_h: 0.015               # HSV色调增强
    hsv_s: 0.7                 # HSV饱和度增强
    hsv_v: 0.4                 # HSV明度增强
    degrees: 0.0               # 旋转角度
    translate: 0.1             # 平移
    scale: 0.5                 # 缩放
    shear: 0.0                 # 剪切
    perspective: 0.0           # 透视变换
    flipud: 0.0                # 上下翻转概率
    fliplr: 0.5                # 左右翻转概率
    mosaic: 0.0                # Mosaic增强概率
    mixup: 0.0                 # Mixup增强概率

# 评估配置
eval_config:
  batch_size: 32               # 评估批处理大小
  imgsz: 640                   # 评估图像尺寸
  conf: 0.001                  # 评估置信度阈值
  iou: 0.6                     # NMS IoU阈值
  device: 0                    # 评估设备
  save_json: false             # 是否保存JSON格式结果
  save_txt: false              # 是否保存TXT格式结果